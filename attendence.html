<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance - Madrasa-e-Hudallinnas</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #075985;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 16px;
    background: #334155;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0001;
    margin-bottom: 20px;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input,
select {
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

button {
    padding: 11px 17px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.load {
    background: #075985;
    color: white;
}

.present {
    background: #16a34a;
    color: white;
}

.absent {
    background: #dc2626;
    color: white;
}

.save {
    background: #7c3aed;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #e0f2fe;
}

.status {
    font-weight: bold;
}

.present-text {
    color: #16a34a;
}

.absent-text {
    color: #dc2626;
}

.summary {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.summary-card {
    flex: 1;
    min-width: 150px;
    background: #f8fafc;
    padding: 15px;
    border-radius: 8px;
}

.summary-card h3 {
    margin: 0;
    font-size: 14px;
    color: #64748b;
}

.summary-card p {
    font-size: 25px;
    font-weight: bold;
    margin: 8px 0 0;
}

@media(max-width:600px) {

    header {
        display: block;
    }

    header span {
        display: block;
        margin-top: 5px;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }
}

</style>
</head>

<body>

<header>

    <h1>🕌 Madrasa-e-Hudallinnas</h1>

    <span>Attendance Management</span>

</header>


<div class="container">

    <a href="index.html" class="back">
        ← Back to Dashboard
    </a>


    <div class="box">

        <h2>📋 Daily Attendance</h2>

        <div class="controls">

            <input
                type="date"
                id="attendanceDate"
            >

            <select id="classSelect">

                <option value="">
                    Select Class
                </option>

                <option>Class 1</option>
                <option>Class 2</option>
                <option>Class 3</option>
                <option>Class 4</option>
                <option>Class 5</option>
                <option>Class 6</option>
                <option>Class 7</option>
                <option>Class 8</option>
                <option>Class 9</option>
                <option>Class 10</option>

            </select>

            <button
                class="load"
                onclick="loadStudents()"
            >
                Load Students
            </button>

        </div>

    </div>


    <div class="box">

        <div class="summary">

            <div class="summary-card">
                <h3>Total Students</h3>
                <p id="total">0</p>
            </div>

            <div class="summary-card">
                <h3>Present</h3>
                <p id="presentCount">0</p>
            </div>

            <div class="summary-card">
                <h3>Absent</h3>
                <p id="absentCount">0</p>
            </div>

        </div>

    </div>


    <div class="box">

        <table>

            <thead>

                <tr>

                    <th>S.No</th>
                    <th>Student Name</th>
                    <th>Father Name</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="attendanceTable">

            </tbody>

        </table>


        <br>

        <button
            class="save"
            onclick="saveAttendance()"
        >
            💾 Save Attendance
        </button>

    </div>

</div>


<script>

let students =
    JSON.parse(localStorage.getItem("students")) || [];

let attendance = {};


// Today's date

document.getElementById("attendanceDate").value =
    new Date().toISOString().split("T")[0];


// Load students

function loadStudents() {

    let selectedClass =
        document.getElementById("classSelect").value;

    if (!selectedClass) {

        alert("Please select a class.");

        return;
    }


    let filtered =
        students.filter(
            student =>
                student.className === selectedClass
        );


    let table =
        document.getElementById("attendanceTable");

    table.innerHTML = "";


    attendance = {};


    filtered.forEach((student, index) => {

        attendance[index] = "Present";


        table.innerHTML += `

        <tr>

            <td>${index + 1}</td>

            <td>${student.name}</td>

            <td>${student.father}</td>

            <td
                id="status-${index}"
                class="status present-text"
            >
                Present
            </td>

            <td>

                <button
                    class="present"
                    onclick="markPresent(${index})"
                >
                    Present
                </button>

                <button
                    class="absent"
                    onclick="markAbsent(${index})"
                >
                    Absent
                </button>

            </td>

        </tr>

        `;

    });


    updateSummary();

}


// Mark Present

function markPresent(index) {

    attendance[index] = "Present";

    let status =
        document.getElementById(
            "status-" + index
        );

    status.innerText = "Present";

    status.className =
        "status present-text";

    updateSummary();

}


// Mark Absent

function markAbsent(index) {

    attendance[index] = "Absent";

    let status =
        document.getElementById(
            "status-" + index
        );

    status.innerText = "Absent";

    status.className =
        "status absent-text";

    updateSummary();

}


// Update numbers

function updateSummary() {

    let total =
        Object.keys(attendance).length;

    let present =
        Object.values(attendance)
        .filter(x => x === "Present")
        .length;

    let absent =
        Object.values(attendance)
        .filter(x => x === "Absent")
        .length;


    document.getElementById("total")
        .innerText = total;

    document.getElementById("presentCount")
        .innerText = present;

    document.getElementById("absentCount")
        .innerText = absent;

}


// Save attendance

function saveAttendance() {

    let date =
        document.getElementById(
            "attendanceDate"
        ).value;

    let selectedClass =
        document.getElementById(
            "classSelect"
        ).value;


    if (!selectedClass) {

        alert("Please select a class.");

        return;
    }


    let savedAttendance =
        JSON.parse(
            localStorage.getItem("attendance")
        ) || {};


    if (!savedAttendance[date]) {
        savedAttendance[date] = {};
    }


    savedAttendance[date][selectedClass] =
        attendance;


    localStorage.setItem(
        "attendance",
        JSON.stringify(savedAttendance)
    );


    alert(
        "Attendance saved successfully!"
    );

}

</script>

</body>
</html>
