<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madarsa-e-Hudallinnas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        button {
            background: #087f5b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .hidden {
            display: none;
        }

        .back {
            background: #555;
            margin-bottom: 15px;
        }

        .delete {
            background: #d32f2f;
            margin-top: 8px;
            padding: 7px 12px;
        }

        .person {
            background: #f4f7f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Madarsa-e-Hudallinnas</h1>
    <p>Madarsa Management System</p>
</header>

<div class="container">

    <!-- HOME -->
    <div id="home">

        <div class="card">
            <h2>📚 Students</h2>
            <p>Manage student information.</p>
            <button onclick="openPage('studentsPage')">
                Open Students
            </button>
        </div>

        <div class="card">
            <h2>👨‍🏫 Teachers</h2>
            <p>Manage teachers and staff.</p>
            <button onclick="openPage('teachersPage')">
                Open Teachers
            </button>
        </div>

        <div class="card">
            <h2>📅 Attendance</h2>
            <p>Record daily attendance.</p>
            <button onclick="alert('Attendance section - coming next')">
                Open Attendance
            </button>
        </div>

        <div class="card">
            <h2>💰 Fees</h2>
            <p>Manage student fees.</p>
            <button onclick="alert('Fees section - coming next')">
                Open Fees
            </button>
        </div>

    </div>


    <!-- STUDENTS -->
    <div id="studentsPage" class="hidden">

        <button class="back" onclick="goHome()">← Back</button>

        <div class="card">
            <h2>📚 Students</h2>

            <input id="studentName" placeholder="Student name">
            <input id="studentClass" placeholder="Class">
            <input id="studentPhone" placeholder="Phone number">

            <button onclick="addStudent()">
                ➕ Add Student
            </button>
        </div>

        <div class="card">
            <h2>Student List</h2>
            <div id="studentList"></div>
        </div>

    </div>


    <!-- TEACHERS -->
    <div id="teachersPage" class="hidden">

        <button class="back" onclick="goHome()">← Back</button>

        <div class="card">
            <h2>👨‍🏫 Teachers</h2>

            <input id="teacherName" placeholder="Teacher name">

            <input id="teacherSubject"
                   placeholder="Subject / Department">

            <input id="teacherPhone"
                   placeholder="Phone number">

            <button onclick="addTeacher()">
                ➕ Add Teacher
            </button>
        </div>

        <div class="card">
            <h2>Teacher List</h2>
            <div id="teacherList"></div>
        </div>

    </div>

</div>


<script>

    /* -------------------------
       PAGE NAVIGATION
    ------------------------- */

    function openPage(page) {

        document.getElementById("home")
            .classList.add("hidden");

        document.getElementById(page)
            .classList.remove("hidden");

        if (page === "studentsPage") {
            displayStudents();
        }

        if (page === "teachersPage") {
            displayTeachers();
        }
    }


    function goHome() {

        document.getElementById("studentsPage")
            .classList.add("hidden");

        document.getElementById("teachersPage")
            .classList.add("hidden");

        document.getElementById("home")
            .classList.remove("hidden");
    }


    /* -------------------------
       STUDENTS
    ------------------------- */

    let students =
        JSON.parse(localStorage.getItem("students")) || [];


    function addStudent() {

        let name =
            document.getElementById("studentName").value.trim();

        let studentClass =
            document.getElementById("studentClass").value.trim();

        let phone =
            document.getElementById("studentPhone").value.trim();


        if (name === "") {
            alert("Please enter student name");
            return;
        }


        students.push({
            id: Date.now(),
            name: name,
            className: studentClass,
            phone: phone
        });


        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );


        document.getElementById("studentName").value = "";
        document.getElementById("studentClass").value = "";
        document.getElementById("studentPhone").value = "";


        displayStudents();
    }


    function displayStudents() {

        let list =
            document.getElementById("studentList");

        if (students.length === 0) {
            list.innerHTML = "<p>No students added yet.</p>";
            return;
        }


        list.innerHTML = "";


        students.forEach(student => {

            list.innerHTML += `
                <div class="person">
                    <strong>👤 ${student.name}</strong>
                    <br>
                    📚 Class: ${student.className || "Not added"}
                    <br>
                    📱 ${student.phone || "Not added"}
                    <br>
                    <button class="delete"
                        onclick="deleteStudent(${student.id})">
                        Delete
                    </button>
                </div>
            `;
        });
    }


    function deleteStudent(id) {

        students =
            students.filter(student => student.id !== id);

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

        displayStudents();
    }


    /* -------------------------
       TEACHERS
    ------------------------- */

    let teachers =
        JSON.parse(localStorage.getItem("teachers")) || [];


    function addTeacher() {

        let name =
            document.getElementById("teacherName").value.trim();

        let subject =
            document.getElementById("teacherSubject").value.trim();

        let phone =
            document.getElementById("teacherPhone").value.trim();


        if (name === "") {
            alert("Please enter teacher name");
            return;
        }


        teachers.push({
            id: Date.now(),
            name: name,
            subject: subject,
            phone: phone
        });


        localStorage.setItem(
            "teachers",
            JSON.stringify(teachers)
        );


        document.getElementById("teacherName").value = "";
        document.getElementById("teacherSubject").value = "";
        document.getElementById("teacherPhone").value = "";


        displayTeachers();
    }


    function displayTeachers() {

        let list =
            document.getElementById("teacherList");


        if (teachers.length === 0) {
            list.innerHTML = "<p>No teachers added yet.</p>";
            return;
        }


        list.innerHTML = "";


        teachers.forEach(teacher => {

            list.innerHTML += `
                <div class="person">
                    <strong>👨‍🏫 ${teacher.name}</strong>
                    <br>
                    📚 Subject: ${teacher.subject || "Not added"}
                    <br>
                    📱 ${teacher.phone || "Not added"}
                    <br>
                    <button class="delete"
                        onclick="deleteTeacher(${teacher.id})">
                        Delete
                    </button>
                </div>
            `;
        });
    }


    function deleteTeacher(id) {

        teachers =
            teachers.filter(teacher => teacher.id !== id);


        localStorage.setItem(
            "teachers",
            JSON.stringify(teachers)
        );


        displayTeachers();
    }

</script>

</body>
    </html>
