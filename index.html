<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ilm in - Management Portal</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- RemixIcons for SVG Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b'
            },
            dark: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar & Mobile Smoothness */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-tab {
      color: #10b981;
      position: relative;
    }
    .active-tab::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 3px;
      background-color: #10b981;
      border-radius: 99px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-24 md:pb-6 antialiased selection:bg-brand-500 selection:text-white">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-30 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
        <i class="ri-government-line text-xl"></i>
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight tracking-wide text-white">Ilm in</h1>
        <p class="text-[10px] uppercase font-semibold text-brand-500 tracking-wider">Management Portal</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <button onclick="openModal()" class="flex items-center gap-1.5 bg-brand-600 hover:bg-brand-500 active:scale-95 transition-all text-white px-3 py-2 rounded-xl font-semibold text-xs shadow-lg shadow-brand-600/30">
        <i class="ri-add-line text-base"></i>
        <span class="hidden sm:inline">Add Student</span>
      </button>
      <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-slate-300">
        SA
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="max-w-4xl mx-auto px-4 pt-4 space-y-5">

    <!-- WELCOME CARD -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-brand-900 via-slate-900 to-slate-900 p-5 border border-brand-500/20 shadow-xl">
      <div class="relative z-10">
        <span class="text-[10px] font-bold uppercase tracking-widest text-brand-500 bg-brand-500/10 px-2.5 py-1 rounded-full border border-brand-500/20">
          Assalamu Alaikum
        </span>
        <h2 class="text-lg font-bold text-white mt-2">Madrasa Student Directory</h2>
        <p class="text-xs text-slate-400 mt-1 max-w-sm">Manage student profiles, search, edit records, and monitor stats on the go.</p>
      </div>
      <i class="ri-book-open-line absolute -right-3 -bottom-4 text-8xl text-brand-500/10 pointer-events-none"></i>
    </div>

    <!-- STATS OVERVIEW CARDS (SWIPABLE ON MOBILE) -->
    <div class="grid grid-cols-3 gap-3">
      <div class="glass-card rounded-2xl p-3.5 text-center border border-slate-800">
        <span class="text-xs text-slate-400 font-medium">Students</span>
        <h3 id="stat-count" class="text-xl font-extrabold text-white mt-1">0</h3>
      </div>
      <div class="glass-card rounded-2xl p-3.5 text-center border border-slate-800">
        <span class="text-xs text-slate-400 font-medium">Active</span>
        <h3 id="stat-active" class="text-xl font-extrabold text-emerald-400 mt-1">0</h3>
      </div>
      <div class="glass-card rounded-2xl p-3.5 text-center border border-slate-800">
        <span class="text-xs text-slate-400 font-medium">Inactive</span>
        <h3 id="stat-inactive" class="text-xl font-extrabold text-rose-400 mt-1">0</h3>
      </div>
    </div>

    <!-- SEARCH & FILTER TOOLBAR -->
    <div class="space-y-2">
      <div class="flex gap-2">
        <div class="relative flex-1">
          <i class="ri-search-line absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="search-input" oninput="filterStudents()" placeholder="Search name, roll no, parent..." 
            class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors">
        </div>
        <select id="filter-class" onchange="filterStudents()" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-brand-500">
          <option value="">All Classes</option>
          <option value="Class 1">Class 1</option>
          <option value="Class 2">Class 2</option>
          <option value="Class 3">Class 3</option>
          <option value="Hifz">Hifz</option>
        </select>
      </div>
    </div>

    <!-- STUDENT LIST / CARDS (MOBILE FIRST UI) -->
    <div id="student-list" class="space-y-3">
      <!-- Dynamic Student Cards Render Here -->
    </div>

  </main>

  <!-- BOTTOM MOBILE NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-slate-950/90 backdrop-blur-lg border-t border-slate-800/80 px-6 py-2 md:hidden">
    <div class="flex justify-around items-center">
      <a href="#dashboard" class="flex flex-col items-center gap-1 active-tab text-xs font-semibold">
        <i class="ri-dashboard-3-line text-lg"></i>
        <span>Home</span>
      </a>
      <a href="#students" class="flex flex-col items-center gap-1 text-slate-400 text-xs font-semibold hover:text-white transition-colors">
        <i class="ri-user-group-line text-lg"></i>
        <span>Students</span>
      </a>
      <button onclick="openModal()" class="flex flex-col items-center gap-1 text-slate-400 text-xs font-semibold hover:text-white transition-colors">
        <i class="ri-add-circle-line text-lg text-brand-500"></i>
        <span class="text-brand-500">Add</span>
      </button>
      <a href="#fees" class="flex flex-col items-center gap-1 text-slate-400 text-xs font-semibold hover:text-white transition-colors">
        <i class="ri-wallet-3-line text-lg"></i>
        <span>Fees</span>
      </a>
    </div>
  </nav>

  <!-- MODAL FOR ADD / EDIT STUDENT -->
  <div id="student-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="w-full sm:max-w-lg bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-800">
        <div>
          <h3 id="modal-title" class="text-base font-bold text-white">Add New Student</h3>
          <p class="text-xs text-slate-400">Fill in details for general academic records.</p>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i class="ri-close-line text-lg"></i>
        </button>
      </div>

      <form id="student-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="edit-id">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Roll No *</label>
            <input type="text" id="form-roll" required placeholder="e.g. STU-101" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Class / Grade *</label>
            <select id="form-class" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
              <option value="Class 1">Class 1</option>
              <option value="Class 2">Class 2</option>
              <option value="Class 3">Class 3</option>
              <option value="Hifz">Hifz</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Full Name *</label>
          <input type="text" id="form-name" required placeholder="Student's complete name" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Gender</label>
            <select id="form-gender" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
            <select id="form-status" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Parent / Guardian</label>
            <input type="text" id="form-guardian" placeholder="Guardian name" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Phone Number</label>
            <input type="tel" id="form-phone" placeholder="Contact number" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition-colors">Cancel</button>
          <button type="submit" class="w-1/2 bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg shadow-brand-600/30 transition-all">Save Student</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC WITH LOCALSTORAGE PERSISTENCE -->
  <script>
    // Initial mock data if empty
    const initialStudents = [
      { id: 101, roll: "STU-001", name: "Yusuf Abdullah", className: "Class 1", gender: "Male", guardian: "Abdullah Ali", phone: "+91 98765 43210", status: "Active" },
      { id: 102, roll: "STU-002", name: "Aisha Fatima", className: "Hifz", gender: "Female", guardian: "Umar Farooq", phone: "+91 91234 56789", status: "Active" }
    ];

    let students = JSON.parse(localStorage.getItem('ilm_students')) || initialStudents;

    function saveToStorage() {
      localStorage.setItem('ilm_students', JSON.stringify(students));
    }

    function renderStudents(data = students) {
      const container = document.getElementById('student-list');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `
          <div class="glass-card rounded-2xl p-8 text-center text-slate-500">
            <i class="ri-user-search-line text-4xl mb-2 block text-slate-600"></i>
            <p class="text-xs font-medium">No student records found.</p>
          </div>`;
        updateStats();
        return;
      }

      data.forEach(s => {
        const isMale = s.gender === 'Male';
        const avatarBg = isMale ? 'bg-sky-500/10 text-sky-400 border-sky-500/20' : 'bg-pink-500/10 text-pink-400 border-pink-500/20';
        const statusBg = s.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';

        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-4 flex flex-col gap-3 relative transition-all active:scale-[0.99] border border-slate-800';
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full ${avatarBg} border flex items-center justify-center font-bold text-sm">
                <i class="${isMale ? 'ri-user-3-line' : 'ri-user-4-line'}"></i>
              </div>
              <div>
                <h4 class="text-sm font-bold text-white leading-tight">${s.name}</h4>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-[10px] font-semibold text-slate-400">${s.roll}</span>
                  <span class="text-slate-600">•</span>
                  <span class="text-[10px] font-semibold text-brand-400">${s.className}</span>
                </div>
              </div>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${statusBg}">
              ${s.status}
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-400 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/50">
            <div class="flex items-center gap-1.5 truncate">
              <i class="ri-parent-line text-slate-500"></i>
              <span class="truncate">${s.guardian || 'N/A'}</span>
            </div>
            <div class="flex items-center gap-1.5 truncate">
              <i class="ri-phone-line text-slate-500"></i>
              <span class="truncate">${s.phone || 'N/A'}</span>
            </div>
          </div>

          <div class="flex justify-end gap-2 pt-1 border-t border-slate-800/60">
            <button onclick="editStudent(${s.id})" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors">
              <i class="ri-edit-line"></i> Edit
            </button>
            <button onclick="deleteStudent(${s.id})" class="px-3 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors">
              <i class="ri-delete-bin-line"></i> Delete
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      document.getElementById('stat-count').textContent = students.length;
      document.getElementById('stat-active').textContent = students.filter(s => s.status === 'Active').length;
      document.getElementById('stat-inactive').textContent = students.filter(s => s.status === 'Inactive').length;
    }

    function openModal() {
      document.getElementById('modal-title').textContent = 'Add New Student';
      document.getElementById('student-form').reset();
      document.getElementById('edit-id').value = '';
      
      const modal = document.getElementById('student-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeModal() {
      const modal = document.getElementById('student-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;

      const record = {
        id: editId ? parseInt(editId) : Date.now(),
        roll: document.getElementById('form-roll').value,
        name: document.getElementById('form-name').value,
        className: document.getElementById('form-class').value,
        gender: document.getElementById('form-gender').value,
        status: document.getElementById('form-status').value,
        guardian: document.getElementById('form-guardian').value,
        phone: document.getElementById('form-phone').value
      };

      if (editId) {
        const index = students.findIndex(s => s.id === parseInt(editId));
        if (index !== -1) students[index] = record;
      } else {
        students.unshift(record);
      }

      saveToStorage();
      closeModal();
      filterStudents();
    }

    function editStudent(id) {
      const student = students.find(s => s.id === id);
      if (!student) return;

      document.getElementById('modal-title').textContent = 'Edit Student Details';
      document.getElementById('edit-id').value = student.id;
      document.getElementById('form-roll').value = student.roll;
      document.getElementById('form-name').value = student.name;
      document.getElementById('form-class').value = student.className;
      document.getElementById('form-gender').value = student.gender;
      document.getElementById('form-status').value = student.status;
      document.getElementById('form-guardian').value = student.guardian;
      document.getElementById('form-phone').value = student.phone;

      openModal();
    }

    function deleteStudent(id) {
      if (confirm('Are you sure you want to delete this record?')) {
        students = students.filter(s => s.id !== id);
        saveToStorage();
        filterStudents();
      }
    }

    function filterStudents() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const selectedClass = document.getElementById('filter-class').value;

      const filtered = students.filter(s => {
        const matchesQuery = s.name.toLowerCase().includes(query) ||
                             s.roll.toLowerCase().includes(query) ||
                             (s.guardian && s.guardian.toLowerCase().includes(query));
        const matchesClass = selectedClass === '' || s.className === selectedClass;
        return matchesQuery && matchesClass;
      });

      renderStudents(filtered);
    }

    // Initial Render
    renderStudents();
  </script>
</body>
              </html>
